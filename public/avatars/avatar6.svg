<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Outer Neobrutalist Frame -->
  <rect x="0" y="0" width="160" height="160" rx="16" fill="#8A2BE2" stroke="#190019" stroke-width="6"/>
  
  <!-- Subtle Background Pattern -->
  <circle cx="25" cy="25" r="10" fill="#190019" opacity="0.12"/>
  <circle cx="135" cy="25" r="8" fill="#190019" opacity="0.12"/>
  <rect x="120" y="120" width="20" height="20" rx="4" fill="#190019" opacity="0.15" transform="rotate(25 130 130)"/>

  <!-- Character Body / Shoulders -->
  <path d="M 30 160 C 30 125, 60 115, 80 115 C 100 115, 130 125, 130 160 Z" fill="#00FFAE" stroke="#190019" stroke-width="5"/>
  <path d="M 68 122 L 80 136 L 92 122 Z" fill="#F1FAEE" stroke="#190019" stroke-width="4"/>

  <!-- Character Head -->
  <rect x="42" y="38" width="76" height="82" rx="38" fill="#F1FAEE" stroke="#190019" stroke-width="5"/>

  <!-- Hair / Cap -->
  <path d="M 38 60 C 38 32, 54 22, 80 22 C 106 22, 122 32, 122 60 C 112 50, 100 48, 80 48 C 60 48, 48 50, 38 60 Z" fill="#00FFAE" stroke="#190019" stroke-width="5"/>

  <!-- Eyes -->
  <circle cx="62" cy="74" r="5.5" fill="#190019"/>
  <circle cx="98" cy="74" r="5.5" fill="#190019"/>
  <circle cx="64" cy="72" r="1.8" fill="#ffffff"/>
  <circle cx="100" cy="72" r="1.8" fill="#ffffff"/>

  <!-- Glasses if present -->
  

  <!-- Nose -->
  <path d="M 80 77 L 76 87 L 83 87" fill="none" stroke="#190019" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="53" cy="85" r="5" fill="#FF6F61" opacity="0.4"/>
  <circle cx="107" cy="85" r="5" fill="#FF6F61" opacity="0.4"/>

  <!-- Mouth -->
  <path d="M 68 96 Q 80 110 92 96" fill="#190019" stroke="#190019" stroke-width="3"/>
</svg>